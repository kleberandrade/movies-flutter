name: movies
description: A classroom movie explorer with TMDB integration and an offline sample catalog.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_svg: ^2.3.4
  cupertino_icons: ^1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/movies.json
    - assets/tmdb-logo.svg
